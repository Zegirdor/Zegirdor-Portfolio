name: Deploy portfolio to homeserver

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zegirdor-portfolio-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy portfolio
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Publish to Nginx document root
        run: |
          find /var/www/nodejs/zegirdor-portfolio -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          cp -a dist/. /var/www/nodejs/zegirdor-portfolio/
