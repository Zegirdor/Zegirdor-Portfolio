name: Zegirdor Portfolio Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zegirdor-portfolio-deploy
  cancel-in-progress: false

jobs:
  build-on-homeserver:
    name: Build on Home server
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Node dependencies
        run: npm ci

      - name: Check required build settings
        shell: bash
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          VITE_PRIMEUI_LICENSE: ${{ secrets.VITE_PRIMEUI_LICENSE }}
        run: |
          for name in PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD VITE_PRIMEUI_LICENSE; do
            if [ -z "${!name}" ]; then
              echo "Required GitHub secret $name is not configured"
              exit 1
            fi
          done

      - name: Export database data and screenshots
        run: node --env-file-if-exists=.env.local scripts/export-projects.js
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}

      # Share the current export before building, so GitHub can rebuild it
      # without connecting to the private database or reading the SDB mount.
      - name: Upload exported assets for the fallback build
        uses: actions/upload-artifact@v7
        with:
          name: zegirdor-portfolio-exported-assets
          path: public/
          if-no-files-found: error

      - name: Build site from exported assets
        run: npm exec -- vite build --base=./
        env:
          VITE_PRIMEUI_LICENSE: ${{ secrets.VITE_PRIMEUI_LICENSE }}

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          name: zegirdor-portfolio-pages-artifact
          path: dist/

      - name: Upload artifact for the home server
        uses: actions/upload-artifact@v7
        with:
          name: zegirdor-portfolio-homeserver-artifact
          path: dist/
          if-no-files-found: error

  build-on-github:
    name: Build on GitHub (fallback)
    needs: build-on-homeserver
    if: >-
      failure() &&
      needs.build-on-homeserver.result == 'failure' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Node dependencies
        run: npm ci

      # A missing snapshot fails this job. Do not deploy the checked-in
      # placeholder JSON when the server export did not succeed.
      - name: Download the exported database data and screenshots
        uses: actions/download-artifact@v8
        with:
          name: zegirdor-portfolio-exported-assets
          path: public/

      - name: Build site from exported assets
        run: npm exec -- vite build --base=./
        env:
          VITE_PRIMEUI_LICENSE: ${{ secrets.VITE_PRIMEUI_LICENSE }}

      - name: Upload fallback artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          name: zegirdor-portfolio-pages-artifact-fallback
          path: dist/

      - name: Upload fallback artifact for the home server
        uses: actions/upload-artifact@v7
        with:
          name: zegirdor-portfolio-homeserver-artifact-fallback
          path: dist/
          if-no-files-found: error

  deploy-to-github-pages:
    name: Deploy to GitHub Pages
    needs: [build-on-homeserver, build-on-github]
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      (needs.build-on-homeserver.result == 'success' ||
       needs.build-on-github.result == 'success')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build-on-homeserver.result == 'success' && 'zegirdor-portfolio-pages-artifact' || 'zegirdor-portfolio-pages-artifact-fallback' }}

  deploy-to-homeserver:
    name: Deploy to Home server
    needs: [build-on-homeserver, build-on-github]
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      (needs.build-on-homeserver.result == 'success' ||
       needs.build-on-github.result == 'success')
    runs-on: self-hosted
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-on-homeserver.result == 'success' && 'zegirdor-portfolio-homeserver-artifact' || 'zegirdor-portfolio-homeserver-artifact-fallback' }}
          path: dist/

      - name: Publish site to Nginx directory
        run: |
          find /var/www/nodejs/zegirdor-portfolio -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          cp -a dist/. /var/www/nodejs/zegirdor-portfolio/
